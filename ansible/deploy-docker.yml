- name: Deploy FastAPI app with Docker, k3d, and Kubernetes
  hosts: web
  become: yes

  vars:
    app_dir: /opt/my-fastapi-app
    repo_url: https://github.com/Maged-Elshaarawy/my-fastapi-app.git

    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

    k3d_version: v5.6.0
    kubectl_version: v1.30.0
    k3d_cluster_name: fastapi-cluster
    app_user: ubuntu

  tasks:
    # ---------------- System Prep ----------------
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install base dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
        state: present

    # ---------------- Clean old Docker ----------------
    # ================= Cleanup =================
    - name: Remove old Docker packages
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent
        purge: yes
        autoremove: yes
      become: true

    - name: Remove old Docker data
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/docker
        - /var/lib/containerd
      become: true

    - name: Remove snap docker if exists
      shell: snap remove docker || true
      become: true
      ignore_errors: yes

    # ================= Install Docker =================
    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      become: true

    - name: Add Docker repository (auto codename)
      apt_repository:
        repo: >
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_lsb.codename }} stable
        state: present
        filename: docker
      become: true

    - name: Install Docker CE (latest)
      apt:
        update_cache: yes
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
      become: true

    - name: Enable and start Docker
      service:
        name: docker
        state: started
        enabled: yes
      become: true

    # ================= Permissions =================
    - name: Add app user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
      become: true
      
      # ================= Fix Docker PATH for Ansible & all users =================
    - name: Force correct docker binary for all users
      file:
        src: /usr/bin/docker
        dest: /usr/local/bin/docker
        state: link
        force: yes
      become: true

    - name: Reset SSH connection (apply docker path fix)
      meta: reset_connection

    - name: Debug docker version as app user
      shell: |
        which docker
        docker version
      become_user: "{{ app_user }}"
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin"

    # ================= Verification =================
    - name: Verify Docker & API version
      shell: |
        docker version
        docker compose version
      become: true

    - name: Stop Docker before cleanup
      service:
        name: docker
        state: stopped
      become: true

    - name: Remove old Docker data
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/docker
        - /var/lib/containerd
      become: true


    # ---------------- kubectl ----------------
    - name: Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Verify kubectl
      command: kubectl version --client

    # ---------------- k3d ----------------
    - name: Install k3d
      shell: |
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh |
        TAG={{ k3d_version }} bash
      args:
        creates: /usr/local/bin/k3d

    - name: Verify k3d
      command: k3d version

    # ---------------- App ----------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    - name: Clone FastAPI repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        force: yes
        update: yes
      become_user: "{{ app_user }}"

    # ---------------- k3d Cluster ----------------
    - name: Delete old k3d cluster if exists
      shell: k3d cluster delete {{ k3d_cluster_name }} || true
      become_user: "{{ app_user }}"

    - name: Create k3d cluster
      shell: k3d cluster create {{ k3d_cluster_name }}
      become_user: "{{ app_user }}"

    # ---------------- Docker Compose ----------------
    - name: Launch application via Docker Compose
      shell: docker compose up -d
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
