name: Terraform & Ansible Apply

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: terraform-ansible-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.0"
  ANSIBLE_VERSION: "2.17.1"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

jobs:
  infra-apply:
    name: Terraform apply then Ansible
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Configure AWS credentials from file
        env:
          AWS_CREDENTIALS_CONTENT: ${{ secrets.AWS_CREDENTIALS_FILE }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [ -z "$AWS_CREDENTIALS_CONTENT" ]; then
            echo "Error: AWS_CREDENTIALS_FILE secret is not set"
            exit 1
          fi
          mkdir -p ~/.aws
          # Write credentials file (preserve exact formatting, no indentation)
          printf '%s\n' "$AWS_CREDENTIALS_CONTENT" > ~/.aws/credentials
          chmod 600 ~/.aws/credentials
          # Set AWS_REGION in config file
          printf '[default]\nregion = %s\n' "$AWS_REGION" > ~/.aws/config
          chmod 600 ~/.aws/config
          # Verify credentials file exists and has content
          if [ ! -s ~/.aws/credentials ]; then
            echo "Error: AWS credentials file is empty or missing"
            exit 1
          fi
          # Show first line of credentials file (for debugging, without exposing secrets)
          echo "Credentials file created successfully. First line:"
          head -n 1 ~/.aws/credentials || true
          echo "File size: $(wc -c < ~/.aws/credentials) bytes"
          echo "Number of lines: $(wc -l < ~/.aws/credentials)"
          # Extract credentials for environment variables (as fallback)
          # Handle both formats: aws_access_key_id = VALUE and aws_access_key_id=VALUE
          AWS_ACCESS_KEY_ID=$(sed -n '/\[default\]/,/\[/p' ~/.aws/credentials | grep -i aws_access_key_id | sed 's/.*= *\(.*\)/\1/' | tr -d ' ' | head -1)
          AWS_SECRET_ACCESS_KEY=$(sed -n '/\[default\]/,/\[/p' ~/.aws/credentials | grep -i aws_secret_access_key | sed 's/.*= *\(.*\)/\1/' | tr -d ' ' | head -1)
          AWS_SESSION_TOKEN=$(sed -n '/\[default\]/,/\[/p' ~/.aws/credentials | grep -i aws_session_token | sed 's/.*= *\(.*\)/\1/' | tr -d ' ' | head -1)
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Warning: Could not extract credentials from file, will rely on credentials file only"
          else
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
            # Session token is optional (for temporary credentials)
            if [ -n "$AWS_SESSION_TOKEN" ]; then
              echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $GITHUB_ENV
            fi
          fi
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> $GITHUB_ENV

      - name: Verify AWS credentials
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        run: |
          echo "Checking AWS credentials..."
          ls -la ~/.aws/
          echo "AWS_REGION: $AWS_REGION"
          echo "AWS_ACCESS_KEY_ID is set: $([ -n "$AWS_ACCESS_KEY_ID" ] && echo 'yes' || echo 'no')"
          echo "AWS_SECRET_ACCESS_KEY is set: $([ -n "$AWS_SECRET_ACCESS_KEY" ] && echo 'yes' || echo 'no')"
          echo "AWS_SESSION_TOKEN is set: $([ -n "$AWS_SESSION_TOKEN" ] && echo 'yes' || echo 'no')"
          # Test AWS credentials using AWS CLI
          if command -v aws &> /dev/null; then
            echo "Testing AWS credentials..."
            aws sts get-caller-identity || echo "Warning: AWS CLI test failed, but continuing..."
          else
            echo "AWS CLI not installed, skipping credential test"
          fi

      - name: Terraform init
        working-directory: terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Install Ansible
        if: github.event_name != 'pull_request'
        run: |
          python3 -m pip install --upgrade pip
          pip install "ansible==${ANSIBLE_VERSION}"

      - name: Run Ansible playbook
        if: github.event_name != 'pull_request'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/site.yml
